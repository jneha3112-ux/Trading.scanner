<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Alert Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cyber-yellow: #FDE047;
      --deep-onyx: #0A0A0A;
      --charcoal: #171717;
      --void: #0F0F0F;
      --glass-white: rgba(255,255,255,.08);
      --glass-border: rgba(255,255,255,.15);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,.72);
      --text-muted: rgba(255,255,255,.48);
      --accent-green: #10d97a;
      --accent-red: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--deep-onyx) 0%, var(--void) 50%, var(--charcoal) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Liquid Wave Hero Background */
    .liquid-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 580px;
      background: var(--cyber-yellow);
      z-index: 0;
      clip-path: polygon(0 0, 100% 0, 100% 65%, 95% 80%, 80% 90%, 50% 98%, 20% 90%, 5% 80%, 0 65%);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      background: rgba(10, 10, 10, .90);
      border-bottom: 1px solid var(--glass-border);
      padding: 1.25rem 2rem;
    }

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: var(--cyber-yellow);
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      font-weight: 900;
      color: #000;
      box-shadow: 0 8px 24px rgba(253, 224, 71, 0.25);
    }

    .logo-text {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    #status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.1rem;
      background: var(--glass-white);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      backdrop-filter: blur(16px);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    #status-dot.live {
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
      animation: pulse 2s infinite;
    }

    #sound-btn {
      padding: 0.6rem 1.4rem;
      background: var(--cyber-yellow);
      border: none;
      color: #000;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 30px rgba(253, 224, 71, 0.2);
    }

    #sound-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 40px rgba(253, 224, 71, 0.35);
    }

    #sound-btn:active {
      transform: scale(0.92);
    }

    /* Hero Section */
    .hero {
      position: relative;
      z-index: 10;
      padding: 4rem 2rem 10rem 2rem;
      text-align: left;
      max-width: 1280px;
      margin: 0 auto;
    }

    .hero-headline {
      font-size: clamp(2.5rem, 9vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -2px;
      color: #000;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .hero-subtext {
      font-size: 1.2rem;
      color: rgba(0, 0, 0, 0.85);
      max-width: 600px;
      font-weight: 600;
    }

    /* Main Layout */
    main {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: -5rem auto 0 auto;
      padding: 2rem 1.5rem 4rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 2.5rem;
    }

    @media (max-width: 1000px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--glass-white);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 1.75rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: rgba(253, 224, 71, 0.3);
      box-shadow: 0 30px 60px rgba(253, 224, 71, 0.1);
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
    }

    .stat-value {
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      letter-spacing: -1px;
    }

    /* Section Label */
    .section-label {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      margin-top: 2.5rem;
    }

    .section-label:first-child {
      margin-top: 0;
    }

    /* Stock Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.75rem;
      margin-bottom: 2rem;
    }

    .stock-card {
      background: var(--glass-white);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
    }

    .stock-card:hover {
      transform: translateY(-3px);
      border-color: rgba(253, 224, 71, 0.4);
      box-shadow: 0 35px 70px rgba(253, 224, 71, 0.12);
    }

    .stock-card.alerting {
      border-color: var(--accent-green);
      box-shadow: 0 0 30px rgba(16, 217, 122, 0.25);
    }

    .alert-indicator {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
      display: none;
      animation: pulse 2s infinite;
    }

    .stock-card.alerting .alert-indicator {
      display: block;
    }

    .card-ticker {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 1.8px;
      color: rgba(253, 224, 71, 0.9);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .card-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.85rem;
      min-height: 28px;
      line-height: 1.2;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .card-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -1px;
      transition: color 0.3s ease;
    }

    .card-price.flash-up {
      color: var(--accent-green);
    }

    .card-price.flash-down {
      color: var(--accent-red);
    }

    .card-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: rgba(253, 224, 71, 0.1);
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .card-arrow.up {
      background: rgba(16, 217, 122, 0.15);
      color: var(--accent-green);
    }

    .card-arrow.down {
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent-red);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .card-change {
      font-size: 0.8rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      background: rgba(253, 224, 71, 0.15);
      color: var(--cyber-yellow);
    }

    .card-change.up {
      background: rgba(16, 217, 122, 0.15);
      color: var(--accent-green);
    }

    .card-change.down {
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent-red);
    }

    .card-change.flat {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .card-baseline {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .threshold-bar {
      margin-top: 1rem;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.3);
    }

    .threshold-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease, background 0.4s ease;
      background: var(--accent-green);
    }

    /* Alert Panel */
    .alert-panel {
      background: var(--glass-white);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      height: fit-content;
      position: sticky;
      top: 80px;
      max-height: calc(100vh - 100px);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .alert-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .alert-panel-title {
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: 0.3px;
    }

    #alert-count {
      background: rgba(253, 224, 71, 0.2);
      color: var(--cyber-yellow);
      font-size: 0.75rem;
      font-weight: 900;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
    }

    .clear-btn {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .clear-btn:hover {
      color: var(--accent-red);
      background: rgba(255, 71, 87, 0.1);
    }

    .alert-list {
      overflow-y: auto;
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .alert-list::-webkit-scrollbar {
      width: 4px;
    }

    .alert-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .alert-item {
      background: linear-gradient(180deg, rgba(253, 224, 71, 0.08), rgba(253, 224, 71, 0.02));
      border: 1px solid rgba(253, 224, 71, 0.2);
      border-left: 3px solid var(--cyber-yellow);
      border-radius: 14px;
      padding: 1rem;
      animation: slideIn 0.3s ease;
    }

    .alert-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.4rem;
    }

    .alert-ticker {
      font-weight: 800;
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .alert-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .alert-detail {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .alert-detail span {
      font-weight: 700;
    }

    .alert-detail .pos {
      color: var(--accent-green);
    }

    .alert-detail .neg {
      color: var(--accent-red);
    }

    .no-alerts {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .no-alerts-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--deep-onyx);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.5s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--glass-white);
      border-top-color: var(--cyber-yellow);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

<!-- Liquid Hero Wave Background -->
<div class="liquid-bg"></div>

<!-- Loading Overlay -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <p class="loading-text">Initializing scanner…</p>
</div>

<!-- Header -->
<header>
  <div class="header-content">
    <div class="logo">
      <div class="logo-icon">📈</div>
      <div class="logo-text">Stock Scanner</div>
    </div>
    <div class="header-actions">
      <div id="status-badge">
        <div id="status-dot"></div>
        <span id="status-text">Connecting</span>
      </div>
      <button id="sound-btn" onclick="toggleSound()">🔔 Enable</button>
    </div>
  </div>
</header>

<!-- Hero Section -->
<section class="hero">
  <h1 class="hero-headline">Live Stock Alerts</h1>
  <p class="hero-subtext">Monitor real-time price movements and catch opportunities instantly</p>
</section>

<!-- Main Content -->
<main>
  <div>
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Tracking</div>
        <div class="stat-value" id="stat-tracking">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Threshold</div>
        <div class="stat-value" id="stat-threshold">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Alerts Fired</div>
        <div class="stat-value" id="stat-alerts">0</div>
      </div>
    </div>

    <!-- Stock Cards -->
    <div class="section-label">Live Prices</div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <!-- Alert Panel -->
  <div>
    <div class="section-label">Alert Log</div>
    <div class="alert-panel">
      <div class="alert-panel-header">
        <div class="alert-panel-title">
          Recent Alerts
          <span id="alert-count">0</span>
        </div>
        <button class="clear-btn" onclick="clearAlerts()">Clear</button>
      </div>
      <div class="alert-list" id="alert-list">
        <div class="no-alerts">
          <div class="no-alerts-icon">🔕</div>
          No alerts yet.<br/>Waiting for price movements beyond threshold.
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  let soundEnabled = false;
  let lastAlertCount = 0;
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playAlert() {
    if (!soundEnabled) return;
    try {
      const ctx = getAudioCtx();
      const notes = [880, 1046, 1318];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        const t = ctx.currentTime + i * 0.12;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t);
        osc.stop(t + 0.25);
      });
    } catch (_) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('sound-btn');
    btn.textContent = soundEnabled ? '🔇 Off' : '🔔 Enable';
    btn.style.background = soundEnabled ? '#10d97a' : 'var(--cyber-yellow)';
    if (soundEnabled) unlockAudio(true);
  }

  function unlockAudio(playTone = false) {
    try {
      const ctx = getAudioCtx();
      if (ctx.state === 'suspended') {
        ctx.resume().then(() => {
          if (playTone && soundEnabled) playAlert();
        }).catch(() => {
          if (playTone && soundEnabled) playAlert();
        });
      } else if (playTone && soundEnabled) {
        playAlert();
      }
    } catch (_) {
      if (playTone && soundEnabled) playAlert();
    }
  }

  function fmt(price) {
    if (price == null) return '—';
    return '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  }

  function fmtPct(pct) {
    if (pct == null) return '—';
    const sign = pct >= 0 ? '+' : '';
    return sign + pct.toFixed(2) + '%';
  }

  function renderCards(stocks, threshold) {
    const grid = document.getElementById('cards-grid');
    stocks.forEach(s => {
      let card = document.getElementById('card-' + s.ticker);
      const isNew = !card;
      if (isNew) {
        card = document.createElement('div');
        card.id = 'card-' + s.ticker;
        card.className = 'stock-card';
        card.innerHTML = `
          <div class="alert-indicator"></div>
          <div class="card-ticker">${s.ticker}</div>
          <div class="card-name" id="name-${s.ticker}">${s.name || ''}</div>
          <div class="card-header">
            <div class="card-price" id="price-${s.ticker}">—</div>
            <div class="card-arrow flat" id="arrow-${s.ticker}">↔</div>
          </div>
          <div class="card-meta">
            <div class="card-change flat" id="change-${s.ticker}">—</div>
            <div class="card-baseline" id="baseline-${s.ticker}"></div>
          </div>
          <div class="threshold-bar">
            <div class="threshold-fill" id="fill-${s.ticker}"></div>
          </div>`;
        grid.appendChild(card);
      }

      const priceEl = document.getElementById('price-' + s.ticker);
      const arrowEl = document.getElementById('arrow-' + s.ticker);
      const nameEl = document.getElementById('name-' + s.ticker);
      const changeEl = document.getElementById('change-' + s.ticker);
      const baselineEl = document.getElementById('baseline-' + s.ticker);
      const fillEl = document.getElementById('fill-' + s.ticker);

      const pct = s.pct_change;
      const oldPrice = priceEl.dataset.val;
      const newPrice = s.price;

      priceEl.textContent = fmt(newPrice);
      priceEl.dataset.val = newPrice;

      if (nameEl) nameEl.textContent = s.name || '';

      if (arrowEl) {
        if (pct == null) {
          arrowEl.textContent = '↔';
          arrowEl.className = 'card-arrow flat';
        } else if (pct > 0) {
          arrowEl.textContent = '↑';
          arrowEl.className = 'card-arrow up';
        } else if (pct < 0) {
          arrowEl.textContent = '↓';
          arrowEl.className = 'card-arrow down';
        } else {
          arrowEl.textContent = '→';
          arrowEl.className = 'card-arrow flat';
        }
      }

      if (oldPrice && newPrice) {
        const cls = newPrice > parseFloat(oldPrice) ? 'flash-up' : 'flash-down';
        priceEl.classList.remove('flash-up', 'flash-down');
        void priceEl.offsetWidth;
        priceEl.classList.add(cls);
        setTimeout(() => priceEl.classList.remove(cls), 1000);
      }

      changeEl.textContent = fmtPct(pct);
      changeEl.className = 'card-change ' + (pct == null ? 'flat' : pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat');

      card.className = 'stock-card ' + (pct == null ? '' : pct > 0 ? 'up' : 'down');

      if (pct != null && Math.abs(pct) >= threshold) {
        card.classList.add('alerting');
      } else {
        card.classList.remove('alerting');
      }

      baselineEl.textContent = s.baseline ? 'Base: ' + fmt(s.baseline) : '';

      if (pct != null && threshold > 0) {
        const pct_abs = Math.min(Math.abs(pct) / threshold, 1) * 100;
        fillEl.style.width = pct_abs + '%';
        fillEl.style.background = pct_abs >= 100 ? '#ff4757' : pct_abs > 60 ? '#FDE047' : '#10d97a';
      }
    });
  }

  function renderAlerts(alerts) {
    const list = document.getElementById('alert-list');
    list.innerHTML = '';

    if (!alerts || alerts.length === 0) {
      list.innerHTML = `
        <div class="no-alerts">
          <div class="no-alerts-icon">🔕</div>
          No alerts yet.<br/>Waiting for price movements.
        </div>`;
      return;
    }

    alerts.forEach(a => {
      const item = document.createElement('div');
      item.className = 'alert-item';
      const sign = a.pct_change >= 0 ? '+' : '';
      const cls = a.pct_change >= 0 ? 'pos' : 'neg';
      const name = a.name ? `${a.name} (${a.ticker})` : a.ticker;
      item.innerHTML = `
        <div class="alert-item-top">
          <span class="alert-ticker">${name}</span>
          <span class="alert-time">${a.time}</span>
        </div>
        <div class="alert-detail">
          <span class="${cls}">${sign}${a.pct_change.toFixed(2)}%</span>
          · ${fmt(a.price)}
        </div>`;
      list.appendChild(item);
    });
  }

  function clearAlerts() {
    document.getElementById('alert-list').innerHTML = `
      <div class="no-alerts">
        <div class="no-alerts-icon">🔕</div>
        No alerts yet.<br/>Waiting for price movements.
      </div>`;
    document.getElementById('alert-count').textContent = '0';
  }

  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();

      if (!data.initialized) {
        document.getElementById('status-text').textContent = 'Initializing…';
        return;
      }

      document.getElementById('loading-overlay').classList.add('hidden');

      document.getElementById('status-dot').classList.add('live');
      document.getElementById('status-text').textContent = 'Live';

      document.getElementById('stat-tracking').textContent = data.stocks.length;
      document.getElementById('stat-threshold').textContent = '±' + data.threshold.toFixed(2) + '%';

      renderCards(data.stocks, data.threshold);
      renderAlerts(data.alerts);

      const count = data.alert_count || 0;
      const alertCountEl = document.getElementById('alert-count');
      alertCountEl.textContent = count;
      document.getElementById('stat-alerts').textContent = count;

      if (count > lastAlertCount) {
        playAlert();
      }
      lastAlertCount = count;
    } catch (e) {
      document.getElementById('status-dot').classList.remove('live');
      document.getElementById('status-text').textContent = 'Offline';
    }
  }

  document.body.addEventListener('pointerdown', unlockAudio, { once: true });
  fetchStatus();
  setInterval(fetchStatus, 5000);
</script>
</body>
</html>
